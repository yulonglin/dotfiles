# av-prefer device priorities, read by custom_bins/av-prefer.
#
# One line per device: a kind (camera, speaker or mic), then a name. Within a
# kind, the first device present wins, so list them highest priority first.
# A name matches any device whose name contains it, ignoring case, so
# "AirPods" matches "Yulong's AirPods Pro". A kind with no lines is left
# alone. See the names on this Mac with: av-prefer list
#
# AV_PREFER_CONFIG=<path> points av-prefer at another file.

camera  Studio Display Camera
camera  MacBook Pro Camera

speaker AirPods
speaker Studio Display Speakers
speaker MacBook Pro Speakers

# No mic lines: macOS picks the microphone. To keep AirPods playback at full
# quality in calls, uncomment these so the AirPods mic is never chosen:
# mic   Studio Display Microphone
# mic   MacBook Pro Microphone
