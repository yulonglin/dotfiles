# ═══════════════════════════════════════════════════════════════════════════════
# App Registry — single source of truth for GUI apps + App Store apps
# ═══════════════════════════════════════════════════════════════════════════════
# Consumed by:  custom_bins/app-picker  (gum toggle TUI → generates config/Brewfile,
#               then audits the machine against it; `app-picker --audit` audits alone)
# Installed by: custom_bins/mas-get (mas entries via `mas get`)
#               brew bundle --file=config/Brewfile  (casks + formulae; mas lines are no-ops after mas-get)
# NOTE: `brew bundle` runs `mas install` which only re-downloads; `mas get` is needed
#       to acquire+install on a new machine. mas-get runs automatically in install.sh.
#       Ref: https://github.com/Homebrew/brew/issues/21559
#
# Format (pipe-delimited, one app per line):
#   method | id | category | tier | default | name | description | auth
#
#   method   brew | cask | mas
#   id       formula name (brew) / cask token (cask) / numeric App Store id (mas)
#   category text tasks editor llm cli meetings cloud search browser messaging
#            productivity time voice audio vpn auth safari music misc antivirus security
#   tier     1 = official-vendor auto-approve · 2 = mature OSS (review) · 3 = explicit approval
#            (tier-3 ships default=false; toggle on deliberately)
#   default  true | false | exclude
#            true/false — initial toggle state in the picker.
#            exclude    — considered and rejected: never offered in the picker, never
#                         written to the Brewfile, skipped by mas-get and auth-setup.
#                         `app-picker --audit` lists it with an uninstall command while
#                         it is still installed. The description says why and when.
#   name     display name; for `mas` this is the exact App Store title in the Brewfile
#   auth     post-install setup the auth-setup checklist surfaces:
#            none login apikey pair-phone safari-ext license alfred things-cloud
#
# Scope: GUI apps, App Store apps, and the few formulae that exist only to pair with
# one. Cross-platform CLI tools (bat, eza, fd, …) are the PACKAGES_* arrays in
# config.sh, and the AI-tool casks `codex` / `antigravity-cli` come from install.sh
# --ai-tools — the audit treats anything named in config.sh or scripts/shared/helpers.sh
# as declared.
#
# SECURITY POLICY (see claude/rules/safety.md):
#   - Homebrew official casks + Mac App Store only. NEVER add a third-party tap here.
#   - Prefer `mas` (sandboxed, Apple-reviewed) when an app ships full-featured on the
#     App Store — that's the highest trust tier ("MAS-first").
#   - Run `brew info <cask>` / `mas info <id>` and verify vendor+homepage before adding.
#   - Never use --no-quarantine; Gatekeeper/notarization must stay on.
# ═══════════════════════════════════════════════════════════════════════════════

