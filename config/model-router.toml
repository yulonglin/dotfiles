# The one place that says which non-Anthropic models a Claude Code session can
# reach through the model-router gateway, and how. `model-router-wire apply`
# renders this file into everything downstream and restarts the router:
#
#   ~/.config/model-router/config.toml   the router's routes (generated, do not edit)
#   ~/.config/model-router/managed-settings.json
#                                        the gateway wiring keys (see `wiring`
#                                        below) and nothing else; the base-url
#                                        pair embeds the token, so it cannot sit
#                                        in a public file. Staged for the sudo line `apply`
#                                        prints, which installs it as a MANAGED
#                                        drop-in (macOS: /Library/Application
#                                        Support/ClaudeCode/managed-settings.d/
#                                        50-model-router.json; Linux: /etc/
#                                        claude-code/managed-settings.d/). Until
#                                        that sudo step is run on a machine, the
#                                        keys stay in the user settings.json.
#   ~/.claude/settings.json              one modelPicker row per model with
#                                        picker = true, plus ENABLE_TOOL_SEARCH
#                                        and the context-window key. Nothing here
#                                        is secret, so a roster edit needs no root.
#   claude/agents/<id>.md                one agent file per model with agent set
#                                        (generated files carry a marker and are
#                                        removed when the model goes)
#
# Turn a model off with `enabled = false` (or delete its block) and run
# `model-router-wire apply`; `model-router-wire status` shows what is live and
# whether the rendered files have drifted from this one.
#
# Keys per [[models]] entry:
#   id              the provider-facing routing ID; always served as a route
#   aliases         short names, e.g. ["astra"]; every alias is served as a route
#                   too, and the FIRST alias is the name used everywhere you type
#                   one: the /model row, `--model`, the generated agent's name and
#                   `subagent_type`. Without aliases the id plays that part.
#   name            label in the picker and agent description
#   provider        "codex"      = the OpenAI account through the Codex OAuth login
#                                  held by the managed CLIProxyAPI child (no key)
#                   "openrouter" = OpenRouter with the key in
#                                  ~/.config/model-router/secrets.toml
#                   "anthropic"  = a Claude model the router forwards unchanged:
#                                  a picker row only, since Claude Code hides its
#                                  own legacy rows on the first-party provider.
#                                  id must be a claude-* ID; no aliases, no agent,
#                                  context-window optional
#                   another name = an [providers.<name>] block below (OpenAI-
#                                  compatible host; key under that name in secrets.toml)
#   slug            the provider's exact model ID (defaults to id)
#   context-window  where Claude Code compacts this route: rendered as
#                   modelSettings.<routing id>.autoCompactWindow (clamped to
#                   100000-1000000). Use the host's real window from
#                   `verify-providers`; GPT routes use 258400 by choice (input
#                   past 272K bills at a higher rate)
#   description     the picker row's second line; defaults to who bills for the
#                   model: "Claude subscription", "ChatGPT subscription (Codex)",
#                   "OpenRouter, pay per token"
#   enabled         default true
#   picker          default true: a row in /model, in this file's block order
#   agent           default true: an agent file with no fixed effort, so the
#                   level comes from the Agent call's `effort`, else the level
#                   /effort saved for that model (apply keeps it), else the
#                   model's default (high for routed models, per the plugin). A
#                   string (low|medium|high|xhigh) bakes one level in and names
#                   the agent <alias>(<level>); avoid it. false = none.
#   writer-priority optional positive integer: eligible writers, lowest first.
#                   Used by write-prose, not emitted into generated router files.
#                   Only enabled models with an agent qualify; omit to opt out.
#
# Writer fallback: try the next eligible priority on quota or cooldown failure.
# All provider = "codex" models use the same OAuth account and share its quota;
# a provider-wide quota/cooldown error skips the remaining writers on that
# provider. Other failures skip only the failed writer. If no writer remains,
# report the blocker rather than silently choosing an unlisted model.

# The ceiling Claude Code assumes for every routed (non-claude-) model, set in
# settings env as CLAUDE_CODE_MAX_CONTEXT_TOKENS. Each route then compacts at
# min(this, its own context-window), so this sits at the per-model setting's
# 1000000 maximum and the per-route windows do the work. Claude's own models
# ignore it. Replaced the router's usage scaling, deprecated in router 0.1.37.
declared-context-window = 1000000

# false (since 2026-11-13): /model shows Claude Code's built-in lineup first, so a
# new Claude release appears without a bump here, then the rows below in block
# order; Claude Code skips a row the built-in lineup already covers. true shows
# only the rows below (plus Default and the session's current model) -- the
# 2026-10-01 to 2026-11-13 setting, dropped because a pinned Fable 5.1 row hid
# Fable 5.2. Toggle rows and this flag with `model-router-wire picker`.
picker-replace-built-in = false

# How Claude Code reaches the router; the keys land in the managed drop-in.
#   "proxy"    HTTPS_PROXY plus the router's proxyAuthHelper. Claude Code stays on
#              api.anthropic.com, so Remote Control and the desktop app work.
#              Needs the router CA trusted once (`bootstrap.sh trust-ca`), and
#              while the router is down sessions and their tools have no network.
#   "base-url" ANTHROPIC_BASE_URL with the ingress token. No Remote Control.
#   "auto"     proxy on macOS, base-url elsewhere (proxy is untested on Linux).
# Switched from base-url 2026-11-12 so Remote Control works while routed
# (alignment-hive issue 94, fixed by the proxy wiring in model-router 0.1.42).
wiring = "auto"

# Auto mode: once a session has a GPT reply with tool calls, Claude Code checks
# that call and every later one with Sonnet on the Claude plan. With this on,
# the router checks GPT's tool calls on GPT (the screen, then the judge) on the
# ChatGPT plan, so the session keeps Anthropic's free server-side check.
# Experimental: sometimes stricter, a call with no verdict is denied, and a
# call the screen does not clear waits a few seconds longer. Turned on by
# Yulong 2026-11-17. Copied verbatim into the router config; the keys are in
# `bootstrap.sh config-template`.
[auto-mode-classifier]
enabled = true

[providers.openrouter]
base-url = "https://openrouter.ai/api/v1"

# There is deliberately no [providers.openai]. A direct api.openai.com route
# would be the obvious fallback while the Codex OAuth account sits in a 429
# cooldown, and the slugs are there (gpt-5.6-sol, gpt-6-astra and both siblings
# are in the public /v1/models catalogue) -- but the chain cannot carry the
# request. CLIProxyAPI forwards the Anthropic `max_tokens` verbatim as Chat
# Completions `max_tokens`, and OpenAI rejects that parameter for these models:
# "Unsupported parameter: 'max_tokens' is not supported with this model. Use
# 'max_completion_tokens' instead." Nothing on this side can patch it -- the
# provider schema above takes only name/base-url/models, and CLIProxyAPI's own
# per-model `params:` does not rewrite the parameter either (both measured
# 2026-09-12 against cli-proxy-api 7.2.154). The fix is upstream and unmerged,
# so revisit when model-router ships a CLIProxyAPI that carries it:
#   https://github.com/router-for-me/CLIProxyAPI/issues/5005
#   https://github.com/router-for-me/CLIProxyAPI/pull/5669

# ---- Claude models, passed straight through to Anthropic -----------------
# The current lineup. With the built-in lineup on, Claude Code skips these rows
# (it already lists them); they lead /model only when picker-replace-built-in
# is true, and then pin exact versions, so a new release needs its id bumped.

[[models]]
id = "claude-opus-5-5"
name = "Opus 5.5"
provider = "anthropic"

[[models]]
id = "claude-fable-5-2"
name = "Fable 5.2"
provider = "anthropic"

[[models]]
id = "claude-sonnet-5-5"
name = "Sonnet 5.5"
provider = "anthropic"

# Haiku 5.5 completes the 5.5 family (released 2026-10-07): the small, fast
# row for cheap subagents and high-volume work ($0.10/$0.50 per M).
[[models]]
id = "claude-haiku-5-5"
name = "Haiku 5.5"
provider = "anthropic"
picker = false           # off /model (2026-10-28); subagents still take `model: haiku`

# Opus 4.6 is active until at least 2027-02-05 (deprecations page, 2026-09-07).
# Opus 3 is not addable: retired on the API 2026-01-05 and gone from OpenRouter too.
[[models]]
id = "claude-opus-4-6"
name = "Opus 4.6"
provider = "anthropic"
picker = false           # off /model (2026-10-28); subagents still take `model: claude-opus-4-6`

# ---- OpenAI, from the account (never through OpenRouter) ----------------

# `astra` moved here from gpt-6-astra on 2026-11-17. The managed CLIProxyAPI
# 8.0.58 child lists gpt-6.2-astra and gpt-6.2-sol on the account with no pin
# change (router 0.1.36, plugin 0.1.48, both the latest releases), and one chat
# request to each answered. Router 0.1.36 has no built-in route for either, so
# the rendered block names the upstream model itself.
[[models]]
id = "gpt-6.2-astra"
aliases = ["astra"]
writer-priority = 2
name = "GPT-6.2 Astra"
provider = "codex"
context-window = 258400

# The plugin's own gpt-6-astra(-fast) agents and doctor's shipped-agent-routes
# check name this id, so the route stays.
[[models]]
id = "gpt-6-astra"
name = "GPT-6 Astra"
provider = "codex"
context-window = 258400
picker = false           # `astra` is now GPT-6.2 Astra
agent = false

# /model shows rows in file order. Picker priority (Yulong, 2026-11-21):
# Anthropic, OpenAI, Gemini, then DeepSeek, then GLM. Kimi, Muse, Grok and Qwen
# are off the picker ("others aren't very good or important") but keep their
# routes and agents, so the agentic council and anything naming them still work.

# `sol` moved here from gpt-6.1-sol on 2026-11-17, with astra (see above).
[[models]]
id = "gpt-6.2-sol"
aliases = ["sol"]
name = "GPT-6.2 Sol"
provider = "codex"
context-window = 258400

# Gemini sits right below the OpenAI rows in /model (Yulong, 2026-10-28; Sol
# moved up beside Astra 2026-11-21), so its block is here although it routes
# through OpenRouter like the families further down.
# Gemini 3.7 Flash once returned "400 Provider returned error" on a full Claude
# Code request (2026-09-22), not reproduced on 3.7 or 3.8 Flash on 2026-10-12.
# If a 400 recurs on any Gemini, keep the upstream error.metadata.raw.
#
# `gemini` moved here from gemini-4-carbon on 2026-11-18 (Yulong), the day
# Neon was listed on OpenRouter at $3/$15 per M against Carbon's $2/$10.
# Launch-week evidence only, no Epoch ECI yet: Artificial Analysis puts both at
# about 60 at high effort, Neon at about 110 tok/s against 57, and Google
# reports 32% lower cost per task than Carbon. Carbon keeps a slight lead on
# long-horizon agent tasks. Revisit when Epoch scores Neon. A full Claude
# Code turn through the router is what `tests/test_model_router_gateway.sh`
# checks after apply.
[[models]]
id = "gemini-4-neon"
aliases = ["gemini"]
name = "Gemini 4 Neon"
provider = "openrouter"
slug = "google/gemini-4-neon"
context-window = 1048576

# `gemini` named Carbon from 2026-11-12 to 2026-11-18 (Epoch ECI 169.76 against
# Argon's 166.48, intervals overlapping).
[[models]]
id = "gemini-4-carbon"
name = "Gemini 4 Carbon"
provider = "openrouter"
slug = "google/gemini-4-carbon"
context-window = 1048576
picker = false           # `gemini` is now Neon; the route stays for anything naming gemini-4-carbon
agent = false

[[models]]
id = "gemini-4-argon"
name = "Gemini 4 Argon"
provider = "openrouter"
slug = "google/gemini-4-argon"
context-window = 1048576
picker = false           # `gemini` moved on (Carbon, then Neon); the route stays for anything naming gemini-4-argon
agent = false

# `sol` named this model from 2026-10-01 to 2026-11-17. Router 0.1.23 serves
# gpt-6.1-sol through the account (released 2026-09-29, listed by the managed
# CLIProxyAPI 7.3.16 child with no pin change), and the plugin's own
