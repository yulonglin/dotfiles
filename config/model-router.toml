# The one place that says which non-Anthropic models a Claude Code session can
# reach through the model-router gateway, and how. `model-router-wire apply`
# renders this file into everything downstream and restarts the router:
#
#   ~/.config/model-router/config.toml   the router's routes (generated, do not edit)
#   ~/.config/model-router/managed-settings.json
#                                        ANTHROPIC_BASE_URL + one modelPicker row
#                                        per model with picker = true, staged for
#                                        the sudo line `apply` prints, which installs
#                                        it as a MANAGED drop-in (macOS: /Library/
#                                        Application Support/ClaudeCode/managed-
#                                        settings.d/50-model-router.json; Linux:
#                                        /etc/claude-code/managed-settings.d/). The
#                                        user settings.json never carries the token.
#   claude/agents/<id>.md                one agent file per model with agent set
#                                        (generated files carry a marker and are
#                                        removed when the model goes)
#
# Turn a model off with `enabled = false` (or delete its block) and run
# `model-router-wire apply`; `model-router-wire status` shows what is live and
# whether the rendered files have drifted from this one.
#
# Keys per [[models]] entry:
#   id              the provider-facing routing ID; always served as a route
#   aliases         short names, e.g. ["astra"]; every alias is served as a route
#                   too, and the FIRST alias is the name used everywhere you type
#                   one: the /model row, `--model`, the generated agent's name and
#                   `subagent_type`. Without aliases the id plays that part.
#   name            label in the picker and agent description
#   provider        "codex"      = the OpenAI account through the Codex OAuth login
#                                  held by the managed CLIProxyAPI child (no key)
#                   "openrouter" = OpenRouter with the key in
#                                  ~/.config/model-router/secrets.toml
#                   another name = an [providers.<name>] block below (OpenAI-
#                                  compatible host; key under that name in secrets.toml)
#   slug            the provider's exact model ID (defaults to id)
#   context-window  the model's real window at that provider; the router rescales
#                   usage so auto-compaction fires there (only windows larger than
#                   declared-context-window can be scaled)
#   enabled         default true
#   picker          default true: a row in /model
#   agent           default true: an agent file; a string sets the effort
#                   (low|medium|high|xhigh) for models that honour it; false = none

# What Claude Code believes every routed model's window is (set in settings env
# as CLAUDE_CODE_MAX_CONTEXT_TOKENS); 258400 is the Codex backend's input limit.
declared-context-window = 258400

[providers.openrouter]
base-url = "https://openrouter.ai/api/v1"

# ---- OpenAI, from the account (never through OpenRouter) ----------------

[[models]]
id = "gpt-6-astra"
aliases = ["astra"]
name = "GPT-6 Astra"
provider = "codex"
context-window = 258400
agent = "high"

[[models]]
id = "gpt-5.6-sol"
aliases = ["sol"]
name = "GPT-5.6 Sol"
provider = "codex"
context-window = 258400
agent = "high"           # the plugin also ships gpt-5.6-sol(medium|high) on the long id

# The plugin ships agents for these two; keeping the routes stops those agents
# failing on first use. Off the picker until wanted.
[[models]]
id = "gpt-5.6-terra"
name = "GPT-5.6 Terra"
provider = "codex"
context-window = 258400
picker = false
agent = false

[[models]]
id = "gpt-5.6-luna"
name = "GPT-5.6 Luna"
provider = "codex"
context-window = 258400
picker = false
agent = false

# ---- Other families, through OpenRouter ---------------------------------
# Slugs match the council roster in config/openrouter-models.toml; windows are
# the host's guaranteed figure from `verify-providers` on 2026-09-06.

[[models]]
id = "kimi-k3"
aliases = ["kimi"]
name = "Kimi K3"
provider = "openrouter"
slug = "moonshotai/kimi-k3"
context-window = 1048576

[[models]]
id = "glm-5.3"
aliases = ["glm"]
name = "GLM 5.3"
provider = "openrouter"
slug = "z-ai/glm-5.3"
context-window = 262144

[[models]]
id = "muse-spark-1.3"
aliases = ["muse-spark", "muse"]
