# What each trigger may do to each app. `manual:` is the macOS Shortcut's action
# and the ceiling for the idle job's destructive rungs; `auto:` governs hiding
# alone. Scale: skip < hide = minimise < close < quit.
#
# Allowed values - anything else is rejected (exit 78), never guessed:
#   manual:   skip | hide | minimise | close | quit
#     skip      leave the app alone
#     hide      Cmd+H: off screen, every window untouched
#     minimise  every window to the Dock; hidden state is left as it is
#     close     close its windows, keep it running
#     quit      quit it
#   auto:     skip | hide | close | quit   (no minimise: the idle job only hides)
#   hide_after, close_after, quit_after, user_idle:  whole minutes
#   min_visible_percent:  0-100, under defaults: only
#   slow: true | false    per app only - ignores keystrokes, so poll for exit
#
# Started as `clear-mac-apps --migrate-config` output from the old sectioned
# config, then five apps were deliberately moved to the `quit` default:
#   Tailscale, NordVPN, Codex - the GUI is not the daemon. Quitting the
#     Tailscale and NordVPN apps leaves their network extensions running
#     (io.tailscale.ipn.macsys.network-extension 58 MB, com.nordvpn.macos.helper
#     plus Shield.systemextension 205 MB), so the connection survives.
#     Tailscale has since been pulled back to `close` below: the reasoning
#     above says quitting is SAFE, not that it is wanted, and reopening the
#     menu bar app is the friction this avoids. NordVPN and Codex still quit.
#   Claude, Granola - the one change that will actually be felt, and the point
#     of the exercise: closing their windows left the processes resident.

defaults:
  manual: quit
  auto: quit
  hide_after: 15
  close_after: 15
  quit_after: 30
  user_idle: 5
  min_visible_percent: 40

apps:
  Ghostty:               {manual: skip, auto: skip}
  Lettera:               {manual: skip}
  Super Productivity:    {manual: close}
  Things:                {manual: close}
  Things3:               {manual: close}
  Focusmate (Safari):    {manual: minimise}   # the Dock, not off screen - see below
  zoom.us:               {manual: skip}
  Obsidian:              {manual: minimise}
  VoiceInk:              {manual: close}
  Bear:                  {manual: close}
  MacMediaKeyForwarder:  {manual: close}
  Spotify:               {manual: close}   # playback survives a close; never quit
  Mouseless:             {manual: close}
  Antinote:              {manual: close}
  Tailscale:             {manual: close}
  Spark Desktop:         {slow: true}      # ignores keystrokes; poll up to 30 s
  FaceTime:              {manual: quit, auto: skip}   # never touched automatically

# Window-title substrings that spare a window from the close rung. This is NOT
# what keeps Focusmate alive, and must not be read as a backstop for it: the
# branch that consults these patterns is reached only by an app the `apps:` list
# did not already classify, and `manual: minimise` classifies Focusmate first.
# What protects it is the minimise rung plus the bundle id in
# config/safari_web_apps.local, which is the only thing that tells one `Web App`
# process from another. The entry is kept because it still applies if Focusmate
# is ever moved back to close or quit.
protect_windows:
  - Google Meet
  - Focusmate (Safari)
