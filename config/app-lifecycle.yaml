# What each trigger may do to each app. `manual:` is the macOS Shortcut's action
# and the ceiling for the idle job's destructive rungs; `auto:` governs hiding
# alone. Scale: skip < hide < close < quit.
#
# Started as `clear-mac-apps --migrate-config` output from the old sectioned
# config, then five apps were deliberately moved to the `quit` default:
#   Tailscale, NordVPN, Codex - the GUI is not the daemon. Quitting the
#     Tailscale and NordVPN apps leaves their network extensions running
#     (io.tailscale.ipn.macsys.network-extension 58 MB, com.nordvpn.macos.helper
#     plus Shield.systemextension 205 MB), so the connection survives.
#   Claude, Granola - the one change that will actually be felt, and the point
#     of the exercise: closing their windows left the processes resident.
#
# Tailscale was later moved BACK to `skip`, and Cloudflare WARP put there with
# it. The extension-survives finding above still holds - the tunnel does not
# drop - but the menu-bar item is the only way to see or change tunnel state,
# and a sweep that removes it costs a relaunch every time. NordVPN keeps the
# `quit` default: it was not part of that request, so the group above is no
# longer uniform and this comment is the record of why.

defaults:
  manual: quit
  auto: quit
  hide_after: 15
  close_after: 15
  quit_after: 30
  user_idle: 5
  min_visible_percent: 40

apps:
  Ghostty:               {manual: skip, auto: skip}
  Tailscale:             {manual: skip}   # menu-bar item is the only tunnel UI
  Cloudflare WARP:       {manual: skip}   # ditto; daemon is separate either way
  cmux:                  {manual: skip}
  Lettera:               {manual: skip}
  Super Productivity:    {manual: skip}
  Things:                {manual: skip}
  Things3:               {manual: skip}
  Focusmate (Safari):    {manual: skip}
  zoom.us:               {manual: skip}
  Obsidian:              {manual: skip}
  VoiceInk:              {manual: close}
  Bear:                  {manual: close}
  MacMediaKeyForwarder:  {manual: close}
  Spotify:               {manual: close}   # playback survives a close; never quit
  Mouseless:             {manual: close}
  Antinote:              {manual: close}
  Spark Desktop:         {slow: true}      # ignores keystrokes; poll up to 30 s
  FaceTime:              {manual: quit, auto: skip}   # never touched automatically

protect_windows:
  - Google Meet
  - Focusmate (Safari)
