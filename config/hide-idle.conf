# hide-idle-apps scheduling tunable.
#
# Read at runtime by custom_bins/hide-idle-apps and by
# scripts/cleanup/setup_hide_idle_apps.sh (which schedules it). Changing the
# poll interval needs a redeploy to rewrite the launchd job.
#
# An environment variable of the same name overrides this for a MANUAL run only.
# The setup script deliberately ignores it and warns: launchd's ProgramArguments
# carries no environment of ours, so an override would move the plist's
# StartInterval while the job itself still read 60 from this file - and every
# wake longer than 3x60 counts as a skipped poll, restarting every timer. The
# plist and the job have to agree, and this file is the only channel both see.
#
# Everything else lives in config/app-lifecycle.yaml, which both this job and
# clear-mac-apps read: how long an app must be covered before it is hidden
# (hide_after), how visible counts as visible (min_visible_percent), and which
# apps are never hidden at all (`auto: skip`). Only the poll interval is here,
# because it is not a policy about apps - it has to match the launchd
# StartInterval or gap detection means nothing.

# Seconds between polls. Also used for gap detection: a gap longer than 3x this
# means polls were skipped (sleep, logout), so all timers restart instead.
HIDE_IDLE_POLL_SECONDS=60
