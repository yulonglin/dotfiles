# Key-only ssh logins. Installed by `ssh-key-only install` from the dotfiles repo
# (config/sshd/01-key-only.conf); see docs/ssh-key-only.md.
#
# The 01- prefix matters: sshd keeps the FIRST value it reads for each keyword,
# and the drop-ins in sshd_config.d load in name order, ahead of distro files
# such as Ubuntu's 50-cloud-init.conf or macOS's 100-macos.conf.
#
# Both lines are needed. On macOS, password logins arrive as keyboard-interactive
# through PAM, so turning off PasswordAuthentication alone still lets a password in.
PasswordAuthentication no
KbdInteractiveAuthentication no
