# Resource partitioning for local job management
# Edit these absolute values when scaling the machine
#
# CPUQuota: 100% = 1 core (200% = 2 cores, 2000% = 20 cores)
# Memory: systemd suffixes G, M

# Experiments: ML training, data processing, heavy compute
EXPERIMENTS_CPU_QUOTA=200%        # 2 cores (→ 2000% for 20 cores)
EXPERIMENTS_MEMORY_MAX=24G        # Hard cap — OOM-killed above this (→ 96G)
EXPERIMENTS_MEMORY_HIGH=20G       # Soft cap — triggers reclaim pressure (→ 80G)
# Parallelism default is 3 because most jobs are API-bound, not CPU-bound —
# at parallel=1, ~10 independent API jobs silently serialised for an hour
# (2026-08-27). Raise per-box if cores/RAM allow. For memory-heavy stages
# (USACO-style sandboxes, big .eval readers), drop it live before the run:
#   pueue parallel 1 --group experiments
# and restore afterwards; deploy.sh --pueue re-applies this file's value.
EXPERIMENTS_PARALLEL=3            # Max concurrent experiment jobs
EXPERIMENTS_THREADS=2             # Thread cap for numpy/torch/rayon (→ 20)

# Agents: Claude Code, Codex CLI, coding agents
AGENTS_CPU_QUOTA=200%             # 2 cores (→ 1200% for 12 cores)
AGENTS_MEMORY_MAX=8G              # Hard cap (→ 32G)
AGENTS_MEMORY_HIGH=6G             # Soft cap (→ 24G)
AGENTS_PARALLEL=3                 # Max concurrent agent jobs (→ 6); API-bound, same rationale as above
