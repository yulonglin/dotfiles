# ═══════════════════════════════════════════════════════════════════════════════
# Rejected apps — considered, decided against, and kept out for good
# ═══════════════════════════════════════════════════════════════════════════════
# This file answers one question: what did I look at and turn down, and why?
# `config/apps.conf` answers a different one: what gets installed. An app is in
# exactly one of them.
#
# Consumed by:  custom_bins/app-picker
#                 · never offered in the TUI, never written to config/Brewfile
#                 · `--excluded` prints this list with each app's install state
#                 · `--audit` prints an uninstall command while one is still installed
#               custom_bins/mas-get and scripts/setup/auth-setup need no special case:
#               a rejected app has no row in config/apps.conf, so they never see it.
#
# Format (pipe-delimited, one app per line):
#   method | id | name | since | why
#
#   method  brew | cask | mas   (same tokens as config/apps.conf)
#   id      formula name (brew) / cask token (cask) / numeric App Store id (mas)
#   name    display name; for `mas`, the App Store title, which is also how the
#           audit matches the installed .app
#   since   ISO date the decision was made
#   why     one sentence — what covers it instead, or what changed
#
# An id here must NOT also appear in config/apps.conf. app-picker refuses to run if
# one does, because the app would be offered for install and marked for uninstall at
# the same time. To offer a rejected app again, delete its line here and add a row to
# config/apps.conf. Newest decision first; ties by name.
# ═══════════════════════════════════════════════════════════════════════════════

