name: Installers must never stall

# The installers have had this failure mode declared fixed more than once, and
# it came back each time, because the fixes were reasoned about rather than
# reproduced. This workflow reproduces them — on a throwaway runner, which is
# the whole point: the one place it is safe to actually RUN install.sh and
# deploy.sh unattended is a container nobody has to live in afterwards. Never
# run these against a real machine to test them; deploy.sh symlinks ~/.claude
# and bakes DOT_DIR into scheduled jobs.
#
# Only first-party actions (actions/*), matching this repo's supply-chain
# posture (no third-party GHA actions).

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'deploy.sh'
      - 'config.sh'
      - 'scripts/shared/helpers.sh'
      - 'scripts/cloud/**'
      - 'tests/test_no_stall.sh'
      - 'tests/test_installers_silent_pty.sh'
      - 'tests/test_claude_tools_select.sh'
      - 'tests/pty_drive.py'
      - 'tools/claude-tools/src/**'
      - 'tests/test_profile_defaults.sh'
      - 'tests/dump_components.zsh'
      - 'tests/dump_components_cli.zsh'
      - 'scripts/helpers/**'
      - 'tests/golden/**'
      - '.github/workflows/no-stall.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'deploy.sh'
      - 'config.sh'
      - 'scripts/shared/helpers.sh'
      - 'scripts/cloud/**'
      - 'tests/test_no_stall.sh'
      - 'tests/test_installers_silent_pty.sh'
      - 'tests/test_claude_tools_select.sh'
      - 'tests/pty_drive.py'
      - 'tools/claude-tools/src/**'
      - 'tests/test_profile_defaults.sh'
      - 'tests/dump_components.zsh'
      - 'tests/dump_components_cli.zsh'
      - 'scripts/helpers/**'
      - 'tests/golden/**'
      - '.github/workflows/no-stall.yml'
  workflow_dispatch:

permissions:
  contents: read

# The unattended job is minutes long and its subject is things that hang, so a
# rapid series of pushes must not stack full-length runs on top of each other.
concurrency:
  group: no-stall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Stall canary + profile defaults
    runs-on: ubuntu-latest
    # A stalled job must fail fast rather than burn the 6h default: the whole
    # subject of this workflow is things that hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Stall canary
        run: bash tests/test_no_stall.sh

      - name: Profile defaults (pinned component sets)
        run: bash tests/test_profile_defaults.sh

      - name: Mutation check — the canary must still be able to fail
        # A guard that cannot fail proves nothing. Reintroduce the silent cargo
        # build (the stall that outlived several prompt fixes) and require the
        # canary to catch it. Runs on a scratch copy so the checkout stays clean.
        run: |
          cp deploy.sh "$RUNNER_TEMP/deploy.bak"
          sed -i 's|run_with_timeout "${DOTFILES_BUILD_TIMEOUT:-900}" cargo build --release|cargo build --release --quiet|' \
            deploy.sh
          if bash tests/test_no_stall.sh >/dev/null 2>&1; then
            echo "::error::The stall canary passed against a deliberately broken guard — it is vacuous."
            cp "$RUNNER_TEMP/deploy.bak" deploy.sh
            exit 1
          fi
          echo "Canary correctly caught the reintroduced silent build."
          cp "$RUNNER_TEMP/deploy.bak" deploy.sh

  unattended:
    name: Real unattended runs (disposable container)
    runs-on: ubuntu-latest
    # Must exceed the sum of this job's own step deadlines (a cold cargo
    # build ~5min + 2x300s closed-stdin runs + the silent-pty suite and its
    # two mutation runs at up to 4x60s each + 7x180s profiles ≈ 48min), or
    # the outer cap fires first and a slow-but-honest run is reported as a
    # stall. In a workflow about deadlines, the inner ones have to be the
    # binding constraint.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # --allow-worktree/--allow-worktree-deploy are safe HERE and only here:
      # the runner is destroyed afterwards, so a symlink or scheduled job that
      # points at this checkout harms nothing.
      - name: deploy.sh --minimal, stdin closed
        run: timeout 300 zsh ./deploy.sh --allow-worktree-deploy --minimal < /dev/null

      - name: install.sh --minimal, stdin closed
        run: timeout 300 zsh ./install.sh --allow-worktree --minimal < /dev/null

      # The menu binary, built from THIS commit's source. The committed
      # linux binary lags the source by one build-workflow round trip, and a
      # test against a stale binary is the vacuous pass this job exists to
      # end. Cached on Cargo.lock so a no-change build is seconds.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/claude-tools/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/claude-tools/Cargo.lock') }}
      - name: Build claude-tools from source for the menu tests
        working-directory: tools/claude-tools
        run: |
          cargo build --release --locked
          cp target/release/claude-tools ../../custom_bins/claude-tools-linux-x86_64

      - name: select honours its contract on a silent pty
        run: bash tests/test_claude_tools_select.sh custom_bins/claude-tools-linux-x86_64

      # The real failure mode is not "no TTY" — it is a TTY with nobody
      # watching it (tmux pane, agent pty, a run you walked away from): every
      # [[ -t 0 ]] guard is bypassed, yet no one ever types.
      #
      # This used to be `script -qec '...' /dev/null`, which passed in 0.1 s
      # for eleven weeks while the menu sat black on every real terminal:
      # util-linux `script` forwards EOF from its closed stdin into the pty, so
      # the blocking read returned empty at once, and --minimal made "deployed
      # nothing" look identical to success. tests/pty_drive.py holds stdin
      # OPEN and silent instead, the profile is non-minimal so an empty run is
      # distinguishable, and the suite asserts the menu DREW, the run finished
      # inside a tight wall-clock bound, and the profile's components were
      # deployed — not merely "finished in time", which a 60 s internal
      # fallback satisfies on its own (2026-09-04).
      - name: Installers on a silent PTY — menu draws, run finishes
        run: bash tests/test_installers_silent_pty.sh

      - name: Mutation check — a menu binary that reads stdin must turn that suite red
        run: bash tests/test_installers_silent_pty.sh --mutate

      # A wait that gives up eventually is still a stall from the chair; the
      # suite bounds wall-clock too, and this proves that bound has teeth.
      - name: Mutation check — a planted bounded wait must turn it red too
        run: bash tests/test_installers_silent_pty.sh --mutate=bounded

      # Each profile must resolve and run without prompting. bare/agent/standard
      # are the ephemeral-box profiles, which is exactly where nobody is watching.
      #
      # NOT `--profile=X --only vim`: --only calls apply_profile minimal during
      # its deferred apply, wiping the profile entirely, so every iteration
      # deployed one identical component and the step tested nothing. --no-* on
      # the components with side effects keeps each profile's real resolution.
      - name: Every profile parses unattended
        run: |
          for profile in standard devbox agent bare server cloud minimal; do
            echo "── $profile ──"
            timeout 180 zsh ./deploy.sh --allow-worktree-deploy \
              "--profile=$profile" --no-secrets --no-secrets-env --no-bws \
              --no-obsidian-sync --no-claude-tools < /dev/null
          done

      # NOTE: no test_profile_defaults.sh here. It used to run again at this
      # point, described as covering the CLI-flag path — but it is the same
      # command the canary job already runs, so it added no coverage and only
      # spent minutes against the cap. The CLI-vs-env agreement it refers to is
      # asserted there, by test_cli_flags_match_env_profiles.
