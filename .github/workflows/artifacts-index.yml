name: ARTIFACTS.md matches its YAML

# The table in ARTIFACTS.md is generated from one YAML file per published page.
# A hand-edit of the generated block, or a new meta.yml whose row was never
# built, would drift silently — the file still renders, it just stops matching
# the data. This is the check that notices.
#
# Only first-party actions (actions/*), matching this repo's supply-chain posture.

on:
  push:
    branches: [main]
    paths:
      - 'ARTIFACTS.md'
      - 'artifacts/**'
      - 'scripts/build_artifacts_index.py'
      - 'tests/test_build_artifacts_index.py'
      - '.github/workflows/artifacts-index.yml'
  pull_request:
    paths:
      - 'ARTIFACTS.md'
      - 'artifacts/**'
      - 'scripts/build_artifacts_index.py'
      - 'tests/test_build_artifacts_index.py'
      - '.github/workflows/artifacts-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Regenerate and compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than relying on whatever the runner image ships: a
      # system python that turns out to be externally-managed would fail the
      # install step, not the check, and read as a broken guard.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: The committed table must match artifacts/*/meta.yml
        run: python scripts/build_artifacts_index.py --check

      - name: Builder tests
        run: python tests/test_build_artifacts_index.py
