name: Always-on guards

# The tests here guard things that have each already failed silently once, and
# none of them can be triggered by "its own file changed" — which is the trigger
# every other workflow in this repo uses.
#
# The protected-content test catches a trim that silently deletes a passage
# from the always-on rules, which no single edit's own file trigger shows. (Its
# total-bytes ceiling was removed on 2026-11-03: Claude Code's startup warning
# owns size.) The rest are
# security guards whose failure mode is silence: the approval classifier ran
# blind for five months, the env-mask hook was inert from birth, and the
# pre-commit gateway guard is the only thing standing between a loopback token
# and a public repo. A guard that stops running looks exactly like a guard that
# passes, so these run on every push and every pull request, unfiltered.
#
# Deliberately NOT a suite runner for all 85 tests: several need zsh, a tailnet,
# a live router or a macOS host, and a workflow that is red for environmental
# reasons teaches people to ignore it. This is the set that must never go quiet.
#
# Only first-party actions (actions/*), matching this repo's supply-chain posture.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: always-on-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Budget and security guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 and tags: the budget test reads protected passages out of
      # the pretrim-memory-2026-07-29 tag to prove they survived a trim
      # byte-for-byte. A shallow clone has no tags, and the test would error
      # rather than fail — a different and much less legible outcome.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # The context tier every session pays for, before it does any work.
      - name: Always-on protected content and repo CLAUDE.md budget
        run: python -m pytest tests/test_memory_tier_budget.py -q

      # Each guard below carries `if: ${{ !cancelled() }}`: a step is skipped
      # once an earlier one fails, so a red first step would otherwise silence
      # every security guard after it. The job still fails on it.

      # The guard that keeps the tokened loopback URL out of a public repo.
      - name: Pre-commit gateway guard
        if: ${{ !cancelled() }}
        run: bash tests/test_pre_commit_gateway_guard.sh

      # The guard that keeps Codex's per-directory trust paths out of it too.
      - name: Pre-commit Codex trust-table guard
        if: ${{ !cancelled() }}
        run: bash tests/test_pre_commit_codex_trust_guard.sh

      # And Zed's ssh_connections hosts, in a clone without the clean filter.
      - name: Pre-commit Zed ssh_connections guard
        if: ${{ !cancelled() }}
        run: bash tests/test_pre_commit_zed_ssh_guard.sh

      # The pre-commit copy of the CLAUDE.md budget and skills checks: CI alone
      # let main sit red for 19 days, so the edit that breaks them stops locally.
      - name: Pre-commit always-on guard
        if: ${{ !cancelled() }}
        run: bash tests/test_pre_commit_always_on_guard.sh

      # The clean filter that strips that block before git stores the file.
      - name: Zed ssh_connections clean filter
        if: ${{ !cancelled() }}
        run: bash tests/test_zed_strip_ssh_connections.sh

      # The extractor that fed the approval classifier an empty string for five
      # months. These pin the real transcript line shapes.
      - name: Approval classifier context
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_approval_classifier_context.py -q

      - name: Settings shape
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_validate_claude_settings.py -q

      - name: Secrets stay out of the ambient environment
        if: ${{ !cancelled() }}
        run: bash tests/test_secrets_global_scope.sh

      - name: Artifacts are not built in throwaway paths
        if: ${{ !cancelled() }}
        run: bash tests/test_block_throwaway_artifact_path.sh
