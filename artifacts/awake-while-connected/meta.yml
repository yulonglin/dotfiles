summary: >-
  visual summary of why ssh from the phone kept dying on this Mac and what changed. The cause
  was a 1-minute AC sleep timer set for screen lock, which also defeated `ttyskeepawake`: man
  pmset counts a tty as inactive once its idle time exceeds the sleep timer, so a 60 s reading
  pause slept the machine under a live session. Fix is AC sleep 30 (battery and lock unchanged),
  shipped in `scripts/macos_sudo_extras.sh` alongside the mosh-server firewall rule (#198); an
  always-on `caffeinate -s` agent was tried and reverted (#195/#196) after it held a sleep
  assertion for 16h52m against one session.

