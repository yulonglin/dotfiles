summary: >-
  the model-routing decision, chosen by Yulong: Option C, the model-router gateway in every
  session with GPT from the OpenAI account (Codex OAuth) or an OpenAI API key per route,
  OpenRouter for the other families, romp as the remote path; Options A (tool layer) and B
  (gateway child) preserved with the reasoning that rejected them, and two closed routes
  recorded. The accepted cost is stated: a non-Anthropic `ANTHROPIC_BASE_URL` hard-disables
  Remote Control. The design was executed in PR #100 (merged 2026-09-06), so this page is
  the decision record behind `config/model-router.toml` and the gateway rules, not a plan
  awaiting work

