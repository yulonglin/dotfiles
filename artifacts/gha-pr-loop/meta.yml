summary: >-
  spec for the GitHub Actions PR loop that replaces PR 207's local gate: GPT reviews each head
  via codex exec, a Claude Code fixer on the subscription token patches and a separate job
  pushes, every changed commit is re-reviewed up to two fix rounds, run-all.sh runs on every
  head, and only simple ready PRs auto-merge while hooks, settings, secrets and the loop itself
  go to Yulong. Awaiting review; only the subscription-auth probe is built

