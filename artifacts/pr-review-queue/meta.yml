title: Dotfiles Review Queue
url: https://claude.ai/code/artifact/9aeb2de4-1bdb-4ec7-b843-4679ea6e7ef7
org: lin.yulong@gmail.com's Organization   # claude auth status, 2026-09-11
first_published: 2026-09-11
last_updated: 2026-09-11
status: live
published_version: 3   # the publish result reports "capabilities db", so the declaration is live

source: index.html     # hand-written; there is no Markdown behind this one
built: index.html
regression_check: |
  node artifacts/pr-review-queue/checklist-test.js

# The page is nothing but a checklist without this, and the declaration lives in
# the publish call rather than in the HTML, so it is recorded here: a republish
# that omits `capabilities` carries the stored declaration forward, but a first
# publish that omits it leaves claude.use("db") resolving null and every tick
# local to one browser.
capabilities:
  db: {}
db_paths:
  review/checklist/ticks/<pull request number>: |
    { on: <true|false>, updatedAt: <epoch ms> }
    ONE DOCUMENT PER ROW. Two viewers ticking different rows write different
    documents and cannot collide; two ticking the same row resolve
    last-writer-wins, which is the correct reading of one disputed value.
    An untick is a stored `false`, never a deleted key, so no write has to
    replace the whole set to express one. Shared across the org's viewers by
    design -- the queue is one shared review pass, not a private one, so it is
    deliberately not under data/users/.
  review/checklist: |
    { checked: { "<pull request number>": true, ... }, updatedAt: <epoch ms> }
    SUPERSEDED, and deliberately left in place. Every row lived in this one
    document until 2026-09-11, which made each write a read-modify-write of
    every other row with no compare-and-set to make it safe. The page reads it
    once, when the ticks collection is empty and the server has confirmed that,
    and writes each ticked row out under its own key. It is never written or
    deleted, so a viewer served a rolled-back page still finds their ticks.
