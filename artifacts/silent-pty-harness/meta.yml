summary: >-
  why an installer that "did nothing" on 2026-09-04 slipped past every stall check in the repo,
  and what PR #134's harness does about it. The component menu is guarded by `[[ -t 0 ]]`, so a
  test whose stdin is a pipe skips the menu entirely and takes a code path the user never takes
  — only a real TTY with nobody typing reaches the bug. The harness reproduces it and is red on
  main for the right reason, but three of its assertions can be satisfied by a menu nobody can
  use and one case carries no time bound, so it is a diagnostic rather than a gate

source: explainer.md
