established: |
  Measured on this machine on 2026-09-12: the harness was run and is red on `main`, and the
  reviewer reproduced the reported stall through it. The two holes named on the page — three
  assertions satisfiable by an unusable menu, and one unbounded case — were found by reading the
  assertions and driving them, not inferred. Nothing here establishes that the installer is
  correct on macOS; the harness runs on Linux only.
