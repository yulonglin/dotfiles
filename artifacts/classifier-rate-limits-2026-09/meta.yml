status_note: >-
  its causal headline was withdrawn on 2026-09-11, and the page body still argues it —
  read the summary, not the title, until the page is republished

summary: >-
  reports auto-mode classifier `rate-limited` failures over 2026-08-01 to 09-10 by session
  model, against a denominator of classifier-bound tool calls: zero across 23,166 bound calls
  while the model-router gateway was off (19 Aug-5 Sep), 719 over 6-9 Sep of which 93% came
  from Fable 5.1 sessions, every one naming the Opus 1M-context classifier.
  **The causal reading of those counts was withdrawn on 2026-09-11** and is not supported:
  with the session rather than the tool call as the unit, all 209 post-boundary failures come
  from 4 of the 30 sessions that made bound calls, one holding 161, giving Fisher exact
  p = 0.554; 53% of Bash failures over 6-9 Sep repeat the previous failure's command, so
  every per-call rate on the page is inflated by retry loops. What stands is the measurement
  itself — the by-session-model denominator and the counts. Cause of the September failures:
  open. Its sibling page, `artifacts/why-auto-mode-broke-behind-the-gateway/`, carries the
  same retraction and the refutation of the attribution-header explanation

republish_pending: |
  Two reasons, and the second is the blocking one.

  Content. The page still carries the causal argument withdrawn on 2026-09-11
  (see status_note and summary): its title, its headline and its 6 September
  within-day split all read the counts causally. The sibling page was corrected
  in place and published as Version 4; this one was not, because the republish
  below is refused. Correct the page and its title before republishing, do not
  publish the current build as-is.

  Access. The republish was refused: this page lives in the MATS Program org and
  the machine is now signed in to the personal account. To land it, sign back in
  to MATS Program, read the url, then publish with that url.

