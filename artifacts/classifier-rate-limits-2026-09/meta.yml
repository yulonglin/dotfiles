evidence: |
  data-snapshot-2026-09-10.md is the measured input, copied verbatim from the
  session's tmp/artifact-data.md on 2026-09-10, then extended the same day with
  the 2026-09-06 within-day split and the 2026-09-10 reading: counts from
  `claude-usage-audit --model-usage --days 21` (the commit titled
  `classifier failures carry where they happened, and the audit gets a denominator`) and
  `exposure_by_session_model.py`, `onset_0906.py` and `split_gateway_vs_cli.py`
  (all three copied here) over every local Claude Code
  transcript, the router log tallies, the statusline quota cache at
  2026-09-09 09:07Z, and the docs sentences quoted on the page (code.claude.com,
  fetched 2026-09-09 and re-verified 2026-09-10 against permission-modes,
  auto-mode-config and errors). The transcripts and the router log move on, so
  the snapshot cannot be regenerated; data.json is its transcription.

  The retraction on 2026-09-11 rests on a further pass over the same
  transcripts: the per-session recount of the 2026-09-06 split, the repeated-
  command tally over 6-9 September, and a per-CLI-version scan of 4,884
  transcripts (4,040 failures, 84,750 bound calls). Those runs are recorded in
  pull request 110's comment history, not in this directory.

  The page's two source links used to be pinned to branch commits, 3a1cdaf and
  ea8c319. Neither id outlives the squash-merge this repo uses, so both now
  point at `blob/main/` and the producing commits are named by subject instead
  of by id. The exact numbers they produced are not left to a link:
  data-snapshot-2026-09-10.md is the verbatim capture, committed beside the
  page. That file keeps its own `commit 3a1cdaf` untouched, which names the
  branch commit the audit was run at rather than anything that lands on main.

