summary: >-
  the mechanism behind the auto-mode 429s, verified line by line in the installed 2.1.267
  bundle: `CLAUDE_CODE_ATTRIBUTION_HEADER=0` in the settings, combined with a base URL whose
  host is not `api.anthropic.com`, makes Claude Code omit the billing-attribution block from
  classifier requests; the 2.1.229 repair re-adds it only for the literal `api.anthropic.com`
  host and ignores `_CLAUDE_CODE_ASSUME_FIRST_PARTY_BASE_URL` (Anthropic issues
  [64585](https://github.com/anthropics/claude-code/issues/64585) and
  [60438](https://github.com/anthropics/claude-code/issues/60438)).
  **Four of its claims were withdrawn on 2026-09-11** and the page carries the retraction: a
  per-version scan of 4,884 local transcripts refutes the two-condition claim in both
  directions (the 14-18 Aug gateway window recorded 0 failures in 4,056 bound calls, Fable
  sessions 0 of 795, while 153 failures occurred with no gateway on post-2.1.229 CLIs), and
  the 6 September within-day split does not survive the session as the unit of analysis (all
  209 failures come from 4 of 30 sessions, Fisher exact p = 0.554, every one from a session
  started after the boundary). The same call site has a second gate that is true on this
  machine's signed-in configuration, so the block may be absent in every period — and a
  constant cannot explain variation. Cause of the September failures: open. The opt-out is
  gone from the committed settings since `b2868c8`, on its own merits
