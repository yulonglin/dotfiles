summary: >-
  every auto-mode classifier 429 needed two conditions: `CLAUDE_CODE_ATTRIBUTION_HEADER=0`
  (set since March) and a non-`api.anthropic.com` base URL (the model-router gateway). Claude
  Code 2.1.229's repair re-adds the attribution block only when the URL host is literally
  first-party, so gateway days 429'd and direct days did not; 28 days of transcripts split
  exactly on gateway on/off. Fix: drop the opt-out (b2868c8a), gateway kept; verified by
  before/after probes. The 8 Sep A/B was confounded (both arms proxied). Spend levers
  (per-tool classifier cost, 200k+ contexts, concurrency) remain open

