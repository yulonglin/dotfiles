summary: >-
  **Its two-condition causal claim was withdrawn on 2026-09-11.** The live page is the
  original diagnosis and remains uncorrected. A per-version scan of 4,884 transcripts
  refutes its reading in both directions: the 14-18 August gateway window recorded 0
  failures in 4,056 classifier-bound calls, including 0 of 795 in Fable sessions, while
  153 failures occurred without a gateway on post-2.1.229 CLIs. The 9 September probe also
  changed the default model, so it did not isolate the attribution block. What stands is
  the code-level mechanism: the opt-out and base-URL host can omit the billing-attribution
  block from classifier requests. That mechanism does not explain the September failures;
  cause remains open. The corrected sibling page is
  `artifacts/why-auto-mode-broke-behind-the-gateway/`

