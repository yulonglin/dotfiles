summary: >-
  nine models across three families refuse the literal "clear uncopied": every comment
  predating the feature carries no stamp, so it reads as uncopied and the button would wipe
  the page. Ship "Delete copied" instead, on the file's existing arm-and-confirm. Round 1 ran
  against a description 59 commits stale; the corrected re-run flipped the wording to "copied
  out" unanimously
