summary: >-
  a foreign-model picker and Remote Control are mutually exclusive in one process (RC is a
  string check on the `ANTHROPIC_BASE_URL` host, and gateway model discovery needs that URL
  non-Anthropic); an unrecognised model ID silently answers from the default Claude model; a
  TLS-terminating proxy is technically open but rejected on fragility; route foreign models at
  the tool layer instead. Successor to *The Remote Control Inversion* below
