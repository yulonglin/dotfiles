# Repos whose listed directories must be SYMLINKS into ~/vault/tooling/<repo>/.
# Format: <repo>: <dir> [<dir> ...]   — the repo lives at ~/code/<repo>.
#
# block_vault_structure.sh denies writes under a listed dir while it is a real
# directory (meaning the symlink was lost and content would fork from the
# vault); writes through the intended symlink pass untouched.
# nudge_vault_lint.sh reports the same condition at stop time.
dotfiles: specs plans
