# Claude hook feature flags. Missing flags default to on.
# A child flag overrides its parent: nudges = off plus nudges.modern-tools = on.

nudges = off
nudges.uncapped-reader = on
# Fires after an Artifact publish whose URL is not yet in the repo's
# ARTIFACTS.md. Explicitly on because `nudges = off` above disables the family.
nudges.artifact-index = on
# Fires at session start when the LLM council roster has not been reviewed
# against the capability indices for longer than [council].review_days.
# Explicitly on for the same reason: `nudges = off` disables the family.
nudges.council-roster = on

# Fires at session start when the daily dotfiles-sync job failed (rebase
# conflict, rejected commit, push error), held claude/settings.json back, or
# pulled commits that may need a deploy. Explicitly on: `nudges = off` above.
nudges.dotfiles-sync = on

# Fires at session start when the daily cloud-spend-check timer found a
# resource billing a flat daily amount for three days or more -- the signature
# of something left running. Explicitly on: `nudges = off` above.
nudges.cloud-spend = on

# Fires before a Bash command that looks like a polling loop with no deadline
# -- the shape that kept a Modal H100 warm for 31 days. Explicitly on: `nudges
# = off` above.
nudges.undeadlined-poller = on

# Blocking guards. guards.annotation-layer refuses an Artifact publish of an
# HTML page without the md2artifact annotation layer (annotate-html <file>).
# guards.annotation-layer = on

# PostToolUse(Bash): after a successful push of a non-default branch, open a
# draft PR if none exists and inject the review-then-merge instruction.
# Not in the nudges family, so it is on unless set off here.
git.pr-after-push = on
