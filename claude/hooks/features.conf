# Claude hook feature flags. Missing flags default to on.
# A child flag overrides its parent: nudges = off plus nudges.modern-tools = on.

nudges = off
nudges.uncapped-reader = on

# Time-awareness stamps (inject_timestamp.sh on every prompt, elapsed_stamp.sh
# inside long tool loops). Per-repo: touch .claude/no-time-stamps instead.
# time = off
# time.elapsed-stamp = off

# Blocking guards. guards.annotation-layer refuses an Artifact publish of an
# HTML page without the md2review annotation layer (annotate-html <file>).
# guards.annotation-layer = on
